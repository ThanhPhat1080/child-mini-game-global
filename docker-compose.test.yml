# Real Supabase Postgres for the RLS suite: docker compose -f docker-compose.test.yml up -d
# then RLS_DATABASE_URL=postgresql://postgres:postgres@127.0.0.1:54322/postgres npm run test:rls
services:
  db:
    image: supabase/postgres:15.8.1.060
    ports:
      - '54322:5432'
    environment:
      POSTGRES_PASSWORD: postgres
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 2s
      timeout: 3s
      retries: 30
